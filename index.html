<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--red:#ff2f55;--dark:#0d0d0d;--card:#161616;--card2:#1e1e1e;--tg:#0088cc;--tg-glow:rgba(0,136,204,0.4)}
html,body{min-height:100vh;background:var(--dark);font-family:'Outfit',sans-serif;font-weight:700;color:#f0f0f0;display:flex;align-items:center;justify-content:center;padding:24px 16px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,47,85,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,47,85,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid rgba(255,47,85,0.15);border-radius:28px;padding:36px 28px 32px;text-align:center;box-shadow:0 0 60px rgba(255,47,85,0.08),0 20px 60px rgba(0,0,0,0.5)}
.avatar-ring{width:130px;height:130px;border-radius:50%;margin:0 auto 20px;padding:3px;background:conic-gradient(var(--red),#ff6b35,var(--red));animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--card);animation:spin 4s linear infinite reverse}
.avatar-inner img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-size:28px;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1.15;margin-bottom:6px}
.tagline{font-size:14px;font-weight:800;color:#bbb;margin-bottom:28px;letter-spacing:0.02em}
.timer-wrap{background:var(--card2);border:1px solid rgba(255,47,85,0.12);border-radius:16px;padding:14px 16px 12px;margin-bottom:24px}
.timer-label{font-size:11px;font-weight:900;color:var(--red);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.timer-digits{display:flex;justify-content:center;gap:6px;align-items:center}
.time-block{display:flex;flex-direction:column;align-items:center;gap:3px}
.time-num{background:var(--dark);border:1px solid rgba(255,47,85,0.2);border-radius:8px;padding:6px 10px;font-size:36px;font-weight:900;color:#fff;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;transition:transform 0.1s,color 0.1s}
.time-num.pop{transform:scale(1.18);color:var(--red)}
.time-unit{font-size:9px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:0.1em}
.time-sep{font-size:24px;font-weight:900;color:var(--red);margin-bottom:14px;opacity:0.7}
/* progress bar under timer */
.timer-bar-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:10px;overflow:hidden}
.timer-bar{height:100%;background:var(--red);border-radius:2px;transition:width 1s linear}
.redirect-msg{font-size:13px;font-weight:800;color:#ff2f55;margin-bottom:10px;letter-spacing:0.03em}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;background:var(--tg);color:#fff;text-decoration:none;border-radius:50px;font-size:18px;font-weight:900;letter-spacing:0.01em;box-shadow:0 0 24px var(--tg-glow);animation:ctapulse 2s ease-in-out infinite;margin-bottom:8px}
@keyframes ctapulse{0%,100%{box-shadow:0 0 24px var(--tg-glow)}50%{box-shadow:0 0 40px var(--tg-glow),0 0 60px rgba(0,136,204,0.2)}}
.cta:active{transform:scale(0.97)}
.cta-icon{width:22px;height:22px;flex-shrink:0}
.urgency{font-size:12px;font-weight:800;color:#888;margin-bottom:28px}
.urgency strong{color:var(--red)}
.divider{height:1px;background:rgba(255,255,255,0.06);margin:0 -4px 20px}
.footer{font-size:13px;font-weight:800;color:#888}
.footer a{color:var(--red);text-decoration:none;font-weight:900}
.footer a:hover{text-decoration:underline}
@media(max-width:420px){.card{padding:28px 20px 24px;border-radius:22px}.name{font-size:24px}.time-num{font-size:28px;min-width:52px;padding:5px 8px}.cta{font-size:16px;padding:14px 16px}.avatar-ring{width:110px;height:110px}}
</style>
</head>
<body>
<div class="card">
  <div class="avatar-ring">
    <div class="avatar-inner">
      <img src="ashish.jpg" alt="ASHISH BHAI" loading="eager"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect fill=%22%23222%22 width=%22120%22 height=%22120%22/><text x=%2260%22 y=%2272%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23ff2f55%22>📣</text></svg>'">
    </div>
  </div>
  <div class="name">ASHISH BHAI 2</div>
  <div class="tagline">Join the channel now!</div>
  <div class="timer-wrap">
    <div class="timer-label">⚡ AUTO JOINING IN</div>
    <div class="timer-digits">
      <div class="time-block">
        <div class="time-num" id="t-sec">3</div>
        <div class="time-unit">Seconds</div>
      </div>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar" style="width:100%"></div>
    </div>
  </div>
  <div class="redirect-msg" id="redir-msg">🔴 Redirecting to Telegram...</div>
  <a href="https://t.me/+XxwspZNe8bY2YTBl" id="cta-btn" class="cta">
    <svg class="cta-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
    Join Free Telegram
  </a>
  <div class="urgency"><strong>Tap above</strong> if not redirected automatically</div>
</div>
<script>
(function(){
  const LINK = "https://t.me/+XxwspZNe8bY2YTBl";
  const TOTAL = 3;
  let sec = TOTAL;
  const el = document.getElementById('t-sec');
  const msg = document.getElementById('redir-msg');
  const bar = document.getElementById('timer-bar');
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    el.textContent = pad(sec);
    el.classList.add('pop');
    setTimeout(()=>el.classList.remove('pop'),100);
    bar.style.width = (sec / TOTAL * 100) + '%';
    if(sec <= 0){
      msg.textContent = '✅ Redirecting now...';
      bar.style.width = '0%';
      window.location.href = LINK;
      return;
    }
    sec--;
    setTimeout(tick, 1000);
  }
  tick();
})();
</script>
</body>
